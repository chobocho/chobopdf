[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chobopdf"
version = "0.1.0"
description = "PDF page organizer for large files"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",
    "pikepdf>=9",
    "pypdfium2>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
chobopdf = "chobopdf.main:main"

[tool.setuptools.packages.find]
include = ["chobopdf*"]

[tool.setuptools.package-data]
chobopdf = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
